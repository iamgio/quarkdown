# This workflow regenerates the emoji list and commits it to the website repository,
# which serves it at quarkdown.com/tools/emoji.
# It is run on demand, as the emoji set only changes when the emoji library is updated.

name: Update emoji list

on:
  workflow_dispatch:

jobs:
  update-emoji-list:
    runs-on: ubuntu-latest

    steps:
      - uses: iamgio/quarkdown/.github/actions/setup-environment@main

      - name: Build distribution
        uses: burrunan/gradle-cache-action@404534c34a2faa40430357a3183522a845b04f3b # v3.0.3
        with:
          job-id: main
          arguments: distZip

      - name: Unzip distribution
        run: |
          mkdir -p build/unzipped
          unzip -q build/distributions/quarkdown.zip -d build/unzipped
          echo "$PWD/build/unzipped/quarkdown/bin" >> $GITHUB_PATH

      - name: Update emoji list
        uses: ./.github/actions/update-emoji-list
        with:
          quarkdown-path: ./build/unzipped/quarkdown/bin/quarkdown
          website-token: ${{ secrets.COMMITTER_TOKEN }}
