# This workflow will build the project with Gradle and release its build.

name: Gradle deploy

on:
  push:
    branches: [ "main", "workflow-test" ]
    tags: [ "v*" ]
    paths-ignore:
      - '*.md'
      - '**/README.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'

jobs:
  test:
    uses: ./.github/workflows/gradle-test.yml

  build:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write

    steps:
    - uses: iamgio/quarkdown/.github/actions/setup-environment@main
      with:
        full-checkout: true
        checkout-token: ${{ secrets.COMMITTER_TOKEN }}

    # Bumps version.txt and updates CHANGELOG.md so the following build embeds
    # the release version, then commits both files back to main. The rest of the
    # release publishing happens after the build in the second simple-release step below.
    - name: Prepare release
      if: github.ref_type == 'tag'
      uses: iamgio/simple-release@e6ee64b637906f8687d6cc158cab7c3fb745dfef # v1 (v1.3.1)
      with:
        version-file: version.txt
        changelog-file: CHANGELOG.md
        commit: 'true'
        release: 'false'

    - name: Build per-platform distributions
      uses: burrunan/gradle-cache-action@404534c34a2faa40430357a3183522a845b04f3b # v3.0.3
      with:
        job-id: main
        arguments: distZipAll

    - name: Unzip Linux distribution (used by downstream steps)
      run: |
        mkdir -p build/unzipped
        unzip -q build/distributions/quarkdown-linux-x64.zip -d build/unzipped
        echo "$PWD/build/unzipped/quarkdown/bin" >> $GITHUB_PATH

    - name: Echo output files
      run: ls -d "$PWD/build/"* && ls build/distributions

    - name: Deploy wiki
      if: github.ref_type == 'tag'
      uses: ./.github/actions/deploy-wiki
      with:
        quarkdown-path: ${{ github.workspace }}/build/unzipped/quarkdown/bin/quarkdown
        github-token: ${{ secrets.COMMITTER_TOKEN }}

    - name: Distribute artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: quarkdown
        path: build/distributions/quarkdown-*.zip

    # Moves the rolling `latest` tag, publishes a devbuild prerelease,
    # and on tag publishes the tagged release.
    - name: Publish devbuild and release
      uses: iamgio/simple-release@e6ee64b637906f8687d6cc158cab7c3fb745dfef # v1 (v1.3.1)
      with:
        changelog-file: CHANGELOG.md
        update-changelog: 'false'
        body-append-file: SPONSORS.md
        insert-changelog-spacers: 'true'
        devbuild-tag: latest
        devbuild-files: build/distributions/quarkdown-*.zip
        release-files: build/distributions/quarkdown-*.zip

    - name: Generate docs
      uses: burrunan/gradle-cache-action@404534c34a2faa40430357a3183522a845b04f3b # v3.0.3
      with:
        job-id: main
        arguments: quarkdocGenerateAll

    - name: Deploy docs
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
      if: github.ref_type == 'tag'
      with:
        personal_token: ${{ secrets.COMMITTER_TOKEN }}
        external_repository: quarkdown-labs/quarkdown.com
        publish_dir: ./build/docs
        destination_dir: docs

    - name: Deploy devbuild docs
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
      with:
        personal_token: ${{ secrets.COMMITTER_TOKEN }}
        external_repository: quarkdown-labs/quarkdown.com
        publish_dir: ./build/docs
        destination_dir: docs/latest

    # Bump Homebrew (both arches in one commit).
    # A custom action is used instead of mislav/bump-homebrew-formula-action
    # because that action's regex only replaces the first `url "..."` line in
    # the formula, so it can't handle separate on_arm and on_intel blocks.
    - uses: ./.github/actions/bump-homebrew
      if: github.ref_type == 'tag'
      with:
        version: ${{ github.ref_name }}
        committer_token: ${{ secrets.COMMITTER_TOKEN }}

    # Bump Scoop
    - uses: ./.github/actions/bump-scoop
      if: github.ref_type == 'tag'
      with:
        version: ${{ github.ref_name }}
        committer_token: ${{ secrets.COMMITTER_TOKEN }}

  image-publish:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Bump version
      uses: iamgio/simple-release@e6ee64b637906f8687d6cc158cab7c3fb745dfef # v1 (v1.3.1)
      with:
        version-file: version.txt
        commit: 'false'
        release: 'false'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
        labels: |
          org.opencontainers.image.licenses=GPL-3.0-only AND AGPL-3.0-only
        annotations: |
          org.opencontainers.image.title=Quarkdown Docker image
          org.opencontainers.image.description=Versatile Markdown-based typesetting system.
          org.opencontainers.image.url=https://quarkdown.com
      env:
        DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

    - name: Build and push Docker image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        push: true
        platforms: linux/amd64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}

  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up JDK 17
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '17'
        distribution: 'temurin'

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
