name: Quarkdown Environment Setup
description: Sets up Quarkdown execution environment
inputs:
  full-checkout:
    description: "If true, fetches full history and tags. Defaults to false."
    required: false
    default: 'false'
  checkout-token:
    description: "Token used to checkout the repository. Defaults to GITHUB_TOKEN."
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Checkout Repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: ${{ inputs.full-checkout && '0' || '1' }}
        fetch-tags: ${{ inputs.full-checkout }}
        token: ${{ inputs.checkout-token != '' && inputs.checkout-token || github.token }}

    - name: Set up JDK 17
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

    - name: Setup Chrome
      uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
      id: setup-chrome
      with:
        chrome-version: stable
        install-dependencies: true

    - name: Set browser path
      run: |
        echo "QD_CHROME_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> $GITHUB_ENV
      shell: bash