name: Update Emoji List
description: Generates the emoji list with Quarkdown and commits it to the website repository
inputs:
  quarkdown-path:
    description: "Path to the Quarkdown executable"
    required: true
    default: 'quarkdown'
  website-token:
    description: "Token with write access to the website repository"
    required: true
  website-repository:
    description: "Repository that hosts the website sources"
    required: false
    default: 'quarkdown-labs/quarkdown.com'
  website-file:
    description: "Path of the generated emoji list, relative to the website repository"
    required: false
    default: 'src/generated/emoji-list.html'

runs:
  using: composite
  steps:
    - name: Generate emoji list
      run: ${{ inputs.quarkdown-path }} c .github/actions/update-emoji-list/generate.qd -o build/qd-ci --nowrap
      shell: bash

    - name: Checkout website repository
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.website-repository }}
        token: ${{ inputs.website-token }}
        path: build/website

    - name: Copy emoji list into the website sources
      run: |
        target="build/website/${{ inputs.website-file }}"
        mkdir -p "$(dirname "$target")"
        cp build/qd-ci/emoji-list/index.html "$target"
      shell: bash

    - name: Commit emoji list to the website repository
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        repository: build/website
        commit_message: "chore: update emoji list"
        commit_user_name: "github-actions"
        commit_user_email: "github-actions[bot]@users.noreply.github.com"
        file_pattern: ${{ inputs.website-file }}
